server {
  listen 90;
  server_name domain;

  location / {
    root /var/www/html;
    index index.html;
    try_files $url $uri/ /index.html;
  }

  location /api {
    location /api {
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}