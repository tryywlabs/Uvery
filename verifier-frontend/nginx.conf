server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/uvery;
    index index.html;

    # Fixed location block to prevent redirect loops
    location / {
        # The key fix is checking if the file exists before redirecting
        try_files $uri $uri/ /index.html =404;
    }

    # API proxy
    location /api {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Logging
    error_log /var/log/nginx/uvery-error.log;
    access_log /var/log/nginx/uvery-access.log;
}